name: Optimize assets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install optimization tools
        run: |
          npm install sharp glob clean-css-cli terser

      - name: Compress images (lossy but visually safe)
        run: |
          node -e "
          const sharp = require('sharp');
          const { glob } = require('glob');
          const path = require('path');
          const fs = require('fs');

          (async () => {
            const images = await glob('images/**/*.{png,jpg,jpeg}');
            if (images.length === 0) { console.log('No images found.'); return; }
            for (const img of images) {
              const rel = path.relative('images', img);
              const outDir = path.join('images_webp', path.dirname(rel));
              fs.mkdirSync(outDir, { recursive: true });
              const outFile = path.join('images_webp', rel.replace(/\.(png|jpg|jpeg)$/i, '.webp'));
              await sharp(img).webp({ quality: 80 }).toFile(outFile);
              console.log('Converted:', img, '->', outFile);
            }
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Minify CSS
        run: |
          if [ -f styles.css ]; then
            npx cleancss -O2 styles.css -o styles.min.css
          fi

      - name: Minify JS
        run: |
          if [ -f script.js ]; then
            npx terser script.js -c -m -o script.min.js
          fi

      - name: Commit optimized assets
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add images_webp styles.min.css script.min.js
            git commit -m "chore: optimize images and minify assets"
            git push
          else
            echo "No optimization changes to commit."
          fi

